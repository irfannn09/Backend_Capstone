services:
  db:
    image: postgres:16
    container_name: muhamka_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
